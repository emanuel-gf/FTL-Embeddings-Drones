[project]
name = "webinar-dl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.11.0",
    "duckdb>=1.5.3,<2",
    "fiftyone>=1.22.1",
    "folium>=0.20.0",
    "geobr>=2.1.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "kaleido>=1.5.0",
    "labelme>=7.9.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=6.9.0",
    "pystac-client>=0.9.1",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[project.scripts]
webinar-dl = "webinar_dl:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
